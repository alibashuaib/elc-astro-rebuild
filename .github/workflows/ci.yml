name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Optional — build succeeds without them (fetchGoogleReviews returns null
          # and the testimonials section just doesn't render). Add as repo secrets
          # once the Google Business Profile + a Places API key exist.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          # Baked into client-side JS at build time, so it is public by nature --
          # a literal here rather than a secret, kept in step with the
          # connect-src entry in public/.htaccess. Without it the placement test
          # calls "undefined/api/session" and fails silently in production.
          PUBLIC_PLACEMENT_API_URL: https://placement-test-worker.alibashuaib90.workers.dev

      # Gate every PR on the performance/a11y/SEO budgets from the rebuild plan —
      # fail the build if any page drops below the thresholds in lighthouserc.json.
      - name: Lighthouse CI
        run: npx @lhci/cli@0.13.x autorun

  # The placement-test Worker is a separate npm project with its own lockfile, so
  # it needs its own install/test step — it is not covered by the job above.
  # Until this existed, the scoring, band-placement, grading, and admin-auth
  # tests never ran on any PR, and five of them had silently rotted against
  # migrations that landed after they were written.
  placement-test-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: placement-test-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: placement-test-worker/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm test

  # The build and the unit suites cannot see runtime faults inside Astro client
  # scripts: a call to a helper that no longer existed shipped to main with both
  # green, and the kids test threw on its first question. This job loads the
  # real built site against a real Worker and fails on any console error.
  placement-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix placement-test-worker

      - name: Create the local D1 database
        run: npm run db:migrate:local --prefix placement-test-worker

      - name: Start the Worker
        run: |
          npm run dev --prefix placement-test-worker > /tmp/wrangler.log 2>&1 &
          timeout 90 bash -c 'until curl -sf -o /dev/null http://localhost:8787/api/slots; do sleep 2; done'

      - name: Build and serve the site
        run: |
          npx astro build
          npx astro preview --port 4322 > /tmp/preview.log 2>&1 &
          timeout 90 bash -c 'until curl -sf -o /dev/null http://localhost:4322/en/placement-test/; do sleep 2; done'
        env:
          # Must match the Worker started above, not the deployed origin.
          PUBLIC_PLACEMENT_API_URL: http://localhost:8787

      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          SMOKE_BASE_URL: http://localhost:4322

      - name: Worker log on failure
        if: failure()
        run: tail -50 /tmp/wrangler.log /tmp/preview.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
