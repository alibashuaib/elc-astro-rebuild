name: Deploy to Hostinger

# DISABLED until FTP_SERVER/FTP_USERNAME/FTP_PASSWORD repo secrets exist and
# Hostinger hosting is actually ready — re-enable by restoring the `push`/
# `repository_dispatch`/`schedule` triggers below (or run manually via
# workflow_dispatch in the meantime).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # # Lets the CMS's save-webhook trigger a rebuild+deploy too, once wired up
  # # (plan §7: "Saving triggers a webhook → GitHub Action runs → ... FTP-deployed").
  # repository_dispatch:
  #   types: [cms-content-updated]
  # # Rebuilds the Google reviews baked into the homepage weekly, even with no
  # # code changes — reviews are fetched at build time (lib/googleReviews.ts),
  # # not live, so this is what keeps them from going stale between pushes.
  # schedule:
  #   - cron: '0 3 * * 1' # Mondays 03:00 UTC (06:00 Riyadh)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}

      # TODO before this runs for real: add FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
      # as repo secrets (Settings → Secrets and variables → Actions), pointing at the
      # Hostinger shared-hosting FTP account. server-dir is the public_html path for
      # elc.com.sa on that account — confirm the exact path in hPanel before first run.
      - name: Deploy static output via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
